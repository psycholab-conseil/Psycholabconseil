<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Candidatures Praticiens</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --green:#1a7a5e;--green-light:#e8f5f0;--green-mid:#2d9e7a;
  --bg:#f4f7f5;--card:#fff;--text:#1a2e25;--muted:#6b8f7e;
  --border:#d4e6de;--red:#dc2626;--red-bg:#fef2f2;
  --orange:#d97706;--orange-bg:#fffbeb;
  --radius:10px;--shadow:0 2px 16px rgba(26,122,94,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Header */
.header{background:var(--green);color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.1rem;font-weight:700}
.header .badge{background:rgba(255,255,255,.2);border-radius:20px;padding:.2rem .8rem;font-size:.8rem}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh;padding:1rem}
.login-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:2rem;max-width:380px;width:100%;text-align:center}
.login-card h2{color:var(--green);margin-bottom:1.5rem}
.login-card input{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:.9rem;margin-bottom:.8rem}
.login-card input:focus{outline:none;border-color:var(--green)}

/* Contenu principal */
.main{padding:1.5rem;max-width:900px;margin:0 auto}
.tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.tab{padding:.5rem 1.2rem;border-radius:20px;font-size:.85rem;font-weight:600;cursor:pointer;border:2px solid var(--border);background:#fff;color:var(--muted);transition:.2s}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.count-badge{background:var(--orange);color:#fff;border-radius:10px;padding:.1rem .5rem;font-size:.75rem;margin-left:.4rem}

/* Cartes candidature */
.cand-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:1rem;overflow:hidden}
.cand-header{display:flex;align-items:center;gap:1rem;padding:1rem 1.2rem;cursor:pointer}
.cand-photo{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--border)}
.cand-photo.placeholder{background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--green)}
.cand-info{flex:1;min-width:0}
.cand-name{font-weight:700;font-size:1rem}
.cand-meta{font-size:.8rem;color:var(--muted);margin-top:.2rem}
.cand-status{flex-shrink:0}
.badge-wait{background:var(--orange-bg);color:var(--orange);border-radius:20px;padding:.2rem .8rem;font-size:.75rem;font-weight:600}
.badge-ok{background:#d1fae5;color:#065f46;border-radius:20px;padding:.2rem .8rem;font-size:.75rem;font-weight:600}
.badge-rej{background:var(--red-bg);color:var(--red);border-radius:20px;padding:.2rem .8rem;font-size:.75rem;font-weight:600}

/* Détail candidature */
.cand-detail{display:none;border-top:1px solid var(--border);padding:1.2rem}
.cand-detail.open{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.detail-item label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:.2rem}
.detail-item p{font-size:.9rem}
.bio-block{margin-bottom:1rem}
.bio-block label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:.4rem}
.bio-block p{font-size:.9rem;line-height:1.6;color:var(--text)}
.avail-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.avail-chip{background:var(--green-light);color:var(--green);border-radius:6px;padding:.2rem .6rem;font-size:.8rem;font-weight:600}
.actions{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--border)}
.btn{padding:.7rem 1.4rem;border:none;border-radius:var(--radius);font-size:.9rem;font-weight:700;cursor:pointer;transition:.2s;flex:1;min-width:140px}
.btn-validate{background:var(--green);color:#fff}
.btn-validate:hover{background:var(--green-mid)}
.btn-reject{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red)}
.btn-reject:hover{background:#fee2e2}
.btn:disabled{opacity:.5;cursor:not-allowed}
.action-msg{font-size:.85rem;font-weight:600;padding:.5rem .8rem;border-radius:6px;margin-top:.5rem}
.action-ok{background:#d1fae5;color:#065f46}
.action-err{background:var(--red-bg);color:var(--red)}

/* Boutons */
.btn-primary{background:var(--green);color:#fff;border:none;border-radius:var(--radius);padding:.7rem 1.4rem;font-size:.9rem;font-weight:700;cursor:pointer;width:100%;margin-top:.5rem}
.empty{text-align:center;padding:3rem;color:var(--muted)}
.empty .icon{font-size:2.5rem;margin-bottom:.8rem}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-tile{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:1.2rem;text-align:center}
.stat-tile .num{font-size:2rem;font-weight:800;color:var(--green)}
.stat-tile .lbl{font-size:.8rem;color:var(--muted);margin-top:.3rem}
.visitors-table{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.visitors-table h3{padding:1rem 1.2rem;font-size:.95rem;font-weight:700;border-bottom:1px solid var(--border)}
.vrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;padding:.7rem 1.2rem;border-bottom:1px solid var(--border);font-size:.82rem;align-items:center}
.vrow:last-child{border-bottom:none}
.vrow.header{font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg)}
.vrow .email{color:var(--text);word-break:break-all}
.vrow .date{color:var(--muted)}
.vtag{display:inline-block;border-radius:10px;padding:.15rem .5rem;font-size:.75rem;font-weight:600}
.vtag-new{background:#dbeafe;color:#1d4ed8}
.vtag-pro{background:#d1fae5;color:#065f46}
.vtag-anon{background:#f3f4f6;color:#6b7280}
</style>
</head>
<body>

<div class="header">
  <h1>🧠 Psycholab Admin</h1>
  <span class="badge" id="headerBadge">Chargement...</span>
</div>

<!-- Écran de connexion -->
<div id="loginArea" class="login-wrap">
  <div class="login-card">
    <h2>🔐 Accès Administrateur</h2>
    <input type="email" id="adminEmail" placeholder="Email admin" value="psy.aymenkhalsi@gmail.com"/>
    <input type="password" id="adminPass" placeholder="Mot de passe"/>
    <button class="btn-primary" onclick="login()">Se connecter</button>
    <p id="loginErr" style="color:var(--red);font-size:.85rem;margin-top:.8rem;display:none"></p>
  </div>
</div>

<!-- Contenu principal (après connexion) -->
<div id="mainArea" style="display:none">
  <div class="main">
    <div class="tabs">
      <div class="tab active" onclick="filterTab('en_attente',this)">En attente <span class="count-badge" id="cntWait">0</span></div>
      <div class="tab" onclick="filterTab('valide',this)">Validés</div>
      <div class="tab" onclick="filterTab('rejete',this)">Rejetés</div>
      <div class="tab" onclick="filterTab('all',this)">Tous</div>
      <div class="tab" onclick="filterTab('stats',this)">📊 Statistiques</div>
    </div>
    <div id="candList"></div>
    <div id="statsArea" style="display:none"></div>
  </div>
</div>

<script>
const db = supabase.createClient(
  'https://oybfxetivkwnynpvojki.supabase.co',
  'sb_publishable_3lGMf5FZavPM9aSnZEqlFA_6uzmH_CL'
);

// Mot de passe admin simple (côté client — pour usage interne)
const ADMIN_PASS = 'PsychoAdmin2024!';

let allPros = [];
let currentFilter = 'en_attente';

async function login() {
  const email = document.getElementById('adminEmail').value;
  const pass = document.getElementById('adminPass').value;
  const err = document.getElementById('loginErr');

  if (pass !== ADMIN_PASS) {
    err.style.display='block'; err.textContent='Mot de passe incorrect.';
    return;
  }

  document.getElementById('loginArea').style.display='none';
  document.getElementById('mainArea').style.display='block';
  await loadData();
}

async function loadData() {
  const { data, error } = await db.from('pros').select('*').order('candidature_date', {ascending:false});
  if (error) { console.error(error); return; }
  allPros = data || [];
  const waiting = allPros.filter(p => p.statut_candidature === 'en_attente' || (!p.statut_candidature && !p.active));
  document.getElementById('cntWait').textContent = waiting.length;
  document.getElementById('headerBadge').textContent = waiting.length + ' en attente';
  renderList(currentFilter);
}

function filterTab(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if (filter === 'stats') {
    document.getElementById('candList').style.display='none';
    document.getElementById('statsArea').style.display='block';
    loadStats();
  } else {
    document.getElementById('candList').style.display='block';
    document.getElementById('statsArea').style.display='none';
    renderList(filter);
  }
}

async function loadStats() {
  const statsArea = document.getElementById('statsArea');
  statsArea.innerHTML = '<div class="empty"><div class="icon">⏳</div><p>Chargement des statistiques...</p></div>';

  // Charger les utilisateurs Auth via l'API Supabase (table auth.users accessible via admin)
  // On utilise les données de la table pros + on récupère les signups depuis auth
  const { data: pros } = await db.from('pros').select('id,fn,ln,email,active,statut_candidature,candidature_date');

  // Simuler des visiteurs basés sur les comptes créés dans Auth
  // Note : auth.users n'est pas accessible côté client, on utilise pros comme proxy des inscrits
  const total = pros ? pros.length : 0;
  const actifs = pros ? pros.filter(p=>p.active).length : 0;
  const attente = pros ? pros.filter(p=>p.statut_candidature==='en_attente'||(!p.statut_candidature&&!p.active)).length : 0;
  const rejetes = pros ? pros.filter(p=>p.statut_candidature==='rejete').length : 0;

  // Calculer inscrits ce mois
  const now = new Date();
  const firstOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const cemois = pros ? pros.filter(p=>{
    if(!p.candidature_date) return false;
    return new Date(p.candidature_date) >= firstOfMonth;
  }).length : 0;

  statsArea.innerHTML = `
    <div class="stats-grid">
      <div class="stat-tile"><div class="num">${total}</div><div class="lbl">Praticiens inscrits</div></div>
      <div class="stat-tile"><div class="num">${actifs}</div><div class="lbl">Profils actifs</div></div>
      <div class="stat-tile"><div class="num">${attente}</div><div class="lbl">En attente</div></div>
      <div class="stat-tile"><div class="num">${cemois}</div><div class="lbl">Ce mois-ci</div></div>
    </div>

    <div class="visitors-table">
      <h3>👥 Liste des praticiens inscrits</h3>
      <div class="vrow header">
        <span>Nom / Email</span>
        <span>Date d'inscription</span>
        <span>Statut</span>
      </div>
      ${pros && pros.length > 0 ? pros.map(p => {
        const statut = p.statut_candidature || (p.active ? 'valide' : 'en_attente');
        const tagHtml = statut==='valide'
          ? '<span class="vtag vtag-pro">✅ Actif</span>'
          : statut==='en_attente'
            ? '<span class="vtag vtag-new">⏳ Attente</span>'
            : '<span class="vtag vtag-anon">❌ Rejeté</span>';
        const date = p.candidature_date
          ? new Date(p.candidature_date).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})
          : '—';
        return `<div class="vrow">
          <div><strong>${p.fn} ${p.ln}</strong><br/><span class="email">${p.email||'—'}</span></div>
          <div class="date">${date}</div>
          <div>${tagHtml}</div>
        </div>`;
      }).join('') : '<div class="vrow"><span colspan="3" style="color:var(--muted)">Aucun praticien inscrit.</span></div>'}
    </div>

    <div style="margin-top:1rem;padding:1rem;background:var(--card);border-radius:14px;box-shadow:var(--shadow)">
      <h3 style="font-size:.9rem;font-weight:700;margin-bottom:.8rem">📬 Dernier visiteur reçu par email</h3>
      <p style="font-size:.85rem;color:var(--muted)">Pour voir tous les visiteurs et emails reçus, consultez :</p>
      <a href="https://supabase.com/dashboard/project/oybfxetivkwnynpvojki/auth/users" target="_blank"
         style="display:inline-block;margin-top:.5rem;background:var(--green);color:#fff;padding:.5rem 1rem;border-radius:8px;font-size:.85rem;font-weight:600;text-decoration:none">
        🔗 Voir tous les comptes dans Supabase Auth →
      </a>
    </div>
  `;
}

function renderList(filter) {
  let list = allPros;
  if (filter === 'en_attente') list = allPros.filter(p => p.statut_candidature === 'en_attente' || (!p.statut_candidature && !p.active));
  else if (filter === 'valide') list = allPros.filter(p => p.statut_candidature === 'valide' || (p.active && p.statut_candidature !== 'rejete'));
  else if (filter === 'rejete') list = allPros.filter(p => p.statut_candidature === 'rejete');

  const container = document.getElementById('candList');
  if (list.length === 0) {
    container.innerHTML = `<div class="empty"><div class="icon">📭</div><p>Aucune candidature dans cette catégorie.</p></div>`;
    return;
  }

  container.innerHTML = list.map(p => {
    const statut = p.statut_candidature || (p.active ? 'valide' : 'en_attente');
    const badgeHtml = statut==='en_attente'
      ? '<span class="badge-wait">⏳ En attente</span>'
      : statut==='valide'
        ? '<span class="badge-ok">✅ Validé</span>'
        : '<span class="badge-rej">❌ Rejeté</span>';

    const photoHtml = p.photo
      ? `<img class="cand-photo" src="${p.photo}" alt="${p.fn}"/>`
      : `<div class="cand-photo placeholder">👤</div>`;

    const date = p.candidature_date
      ? new Date(p.candidature_date).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})
      : 'Date inconnue';

    const langs = [p.lang_fr&&'Français', p.lang_ar&&'Arabe', p.lang_en&&'Anglais'].filter(Boolean).join(', ') || '—';

    // Disponibilités
    const DAYS_FR = {lundi:'Lun',mardi:'Mar',mercredi:'Mer',jeudi:'Jeu',vendredi:'Ven',samedi:'Sam',dimanche:'Dim'};
    let availHtml = '<div class="avail-chips">';
    if (p.avail && typeof p.avail === 'object') {
      Object.entries(p.avail).forEach(([d,slots])=>{
        if(slots&&slots.length) availHtml += `<span class="avail-chip">${DAYS_FR[d]||d} : ${slots[0]}–${slots[slots.length-1]}</span>`;
      });
    }
    availHtml += '</div>';

    const actionBtns = statut === 'en_attente' ? `
      <button class="btn btn-validate" onclick="valider('${p.id}',this)">✅ Valider et activer</button>
      <button class="btn btn-reject" onclick="rejeter('${p.id}',this)">❌ Rejeter</button>
    ` : statut === 'valide' ? `
      <button class="btn btn-reject" onclick="rejeter('${p.id}',this)">Désactiver</button>
    ` : `
      <button class="btn btn-validate" onclick="valider('${p.id}',this)">Réactiver</button>
    `;

    return `
      <div class="cand-card" id="card_${p.id}">
        <div class="cand-header" onclick="toggleDetail('${p.id}')">
          ${photoHtml}
          <div class="cand-info">
            <div class="cand-name">${p.fn} ${p.ln}</div>
            <div class="cand-meta">${p.spec||'—'} · ${date}</div>
          </div>
          <div class="cand-status">${badgeHtml}</div>
        </div>
        <div class="cand-detail" id="detail_${p.id}">
          <div class="detail-grid">
            <div class="detail-item"><label>Email</label><p>${p.email||'—'}</p></div>
            <div class="detail-item"><label>Téléphone</label><p>${p.tel||'—'}</p></div>
            <div class="detail-item"><label>Tarif</label><p>${p.price||'—'} TND / séance</p></div>
            <div class="detail-item"><label>Langues</label><p>${langs}</p></div>
            <div class="detail-item"><label>RPPS</label><p>${p.rpps||'—'}</p></div>
            <div class="detail-item"><label>Fuseau</label><p>${p.tz||'—'}</p></div>
          </div>
          <div class="bio-block"><label>Biographie</label><p>${p.bio||'—'}</p></div>
          <div class="bio-block"><label>Disponibilités</label>${availHtml}</div>
          <div class="actions">
            ${actionBtns}
          </div>
          <div id="actMsg_${p.id}" style="display:none"></div>
        </div>
      </div>`;
  }).join('');
}

function toggleDetail(id) {
  const detail = document.getElementById('detail_'+id);
  detail.classList.toggle('open');
}

async function valider(id, btn) {
  const msgEl = document.getElementById('actMsg_'+id);
  btn.disabled=true; btn.textContent='⏳ Activation...';
  msgEl.style.display='block'; msgEl.className='action-msg';
  msgEl.textContent='Activation du compte en cours...';

  const pro = allPros.find(p=>p.id===id);
  if (!pro) { msgEl.textContent='Praticien introuvable.'; return; }

  // 1. Activer le profil dans pros
  const { error: upErr } = await db.from('pros').update({
    active: true,
    statut_candidature: 'valide'
  }).eq('id', id);

  if (upErr) {
    btn.disabled=false; btn.textContent='✅ Valider et activer';
    msgEl.className='action-msg action-err';
    msgEl.textContent='Erreur activation profil : '+upErr.message;
    return;
  }

  // 2. Créer le compte Auth via la fonction Edge (si disponible) ou afficher les infos
  // Note: la création Auth nécessite la service_role key — on affiche les infos pour que l'admin le fasse manuellement si non configuré
  const tmpPass = pro.fn.charAt(0).toUpperCase()+pro.fn.slice(1).toLowerCase()+(new Date().getFullYear())+'!';

  msgEl.className='action-msg action-ok';
  msgEl.innerHTML = `
    ✅ <strong>Profil activé !</strong> ${pro.fn} ${pro.ln} apparaît maintenant sur le site.<br/><br/>
    📧 <strong>Créez le compte Auth dans Supabase :</strong><br/>
    Email : <code style="background:#f0faf6;padding:.1rem .3rem;border-radius:3px">${pro.email}</code><br/>
    Mot de passe provisoire : <code style="background:#f0faf6;padding:.1rem .3rem;border-radius:3px">${tmpPass}</code><br/><br/>
    Lien Auth : <a href="https://supabase.com/dashboard/project/oybfxetivkwnynpvojki/auth/users" target="_blank" style="color:var(--green)">Ouvrir Supabase Auth →</a>
  `;

  btn.textContent='✅ Activé';
  // Mettre à jour la liste locale
  const idx = allPros.findIndex(p=>p.id===id);
  if(idx>=0){ allPros[idx].active=true; allPros[idx].statut_candidature='valide'; }
}

async function rejeter(id, btn) {
  const msgEl = document.getElementById('actMsg_'+id);
  if (!confirm('Confirmer le rejet de cette candidature ?')) return;
  btn.disabled=true;

  const { error } = await db.from('pros').update({
    active: false,
    statut_candidature: 'rejete'
  }).eq('id', id);

  msgEl.style.display='block';
  if (error) {
    btn.disabled=false;
    msgEl.className='action-msg action-err';
    msgEl.textContent='Erreur : '+error.message;
  } else {
    msgEl.className='action-msg';
    msgEl.style.background='#fef2f2'; msgEl.style.color=var(--red)||'#dc2626';
    msgEl.textContent='❌ Candidature rejetée.';
    const idx = allPros.findIndex(p=>p.id===id);
    if(idx>=0){ allPros[idx].active=false; allPros[idx].statut_candidature='rejete'; }
    btn.textContent='Désactivé';
  }
}
</script>
</body>
</html>
