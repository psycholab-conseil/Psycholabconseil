<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Candidatures Praticiens</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f4f7f5;color:#1a2e25;min-height:100vh}
.header{background:#1a7a5e;color:#fff;padding:.9rem 1.2rem;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1rem;font-weight:700}
.badge{background:rgba(255,255,255,.2);border-radius:20px;padding:.2rem .8rem;font-size:.8rem}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:85vh;padding:1rem}
.login-card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.1);padding:2rem;max-width:360px;width:100%;text-align:center}
.login-card h2{color:#1a7a5e;margin-bottom:1.5rem;font-size:1.3rem}
.field{margin-bottom:.8rem;position:relative}
.field input{width:100%;padding:.75rem 1rem;border:1.5px solid #d4e6de;border-radius:8px;font-size:.95rem;outline:none}
.field input:focus{border-color:#1a7a5e}
.eye{position:absolute;right:.8rem;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.1rem;background:none;border:none;padding:0}
.btn-login{width:100%;padding:.85rem;background:#1a7a5e;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:.4rem}
.btn-login:active{background:#155f4a}
.err{color:#dc2626;font-size:.85rem;margin-top:.6rem;display:none}
.main{padding:1rem;max-width:900px;margin:0 auto}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}
.tab{padding:.45rem 1rem;border-radius:20px;font-size:.82rem;font-weight:600;cursor:pointer;border:2px solid #d4e6de;background:#fff;color:#6b8f7e}
.tab.active{background:#1a7a5e;color:#fff;border-color:#1a7a5e}
.nbadge{background:#d97706;color:#fff;border-radius:10px;padding:.1rem .45rem;font-size:.72rem;margin-left:.3rem}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:.8rem;overflow:hidden}
.card-head{display:flex;align-items:center;gap:.8rem;padding:.9rem 1rem;cursor:pointer}
.avatar{width:48px;height:48px;border-radius:50%;background:#e8f5f0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.cinfo{flex:1;min-width:0}
.cname{font-weight:700;font-size:.95rem}
.cmeta{font-size:.78rem;color:#6b8f7e;margin-top:.15rem}
.bwait{background:#fffbeb;color:#d97706;border-radius:20px;padding:.2rem .7rem;font-size:.72rem;font-weight:700}
.bok{background:#d1fae5;color:#065f46;border-radius:20px;padding:.2rem .7rem;font-size:.72rem;font-weight:700}
.brej{background:#fef2f2;color:#dc2626;border-radius:20px;padding:.2rem .7rem;font-size:.72rem;font-weight:700}
.detail{display:none;border-top:1px solid #e8f0ec;padding:1rem}
.detail.open{display:block}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:.8rem}
.di label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6b8f7e;display:block;margin-bottom:.2rem}
.di p{font-size:.88rem}
.bio{margin-bottom:.8rem}
.bio label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6b8f7e;display:block;margin-bottom:.3rem}
.bio p{font-size:.88rem;line-height:1.55}
.acts{display:flex;gap:.6rem;flex-wrap:wrap;padding-top:.8rem;border-top:1px solid #e8f0ec}
.btn-v{flex:1;min-width:120px;padding:.65rem;background:#1a7a5e;color:#fff;border:none;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer}
.btn-r{flex:1;min-width:120px;padding:.65rem;background:#fef2f2;color:#dc2626;border:1.5px solid #dc2626;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer}
.btn-v:disabled,.btn-r:disabled{opacity:.5;cursor:not-allowed}
.amsg{font-size:.83rem;font-weight:600;padding:.45rem .7rem;border-radius:6px;margin-top:.5rem;display:none}
.amsg-ok{background:#d1fae5;color:#065f46}
.amsg-err{background:#fef2f2;color:#dc2626}
.empty{text-align:center;padding:3rem;color:#6b8f7e}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem}
.chip{background:#e8f5f0;color:#1a7a5e;border-radius:6px;padding:.18rem .55rem;font-size:.78rem;font-weight:600}
/* Stats */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.8rem;margin-bottom:1.2rem}
.stile{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:1rem;text-align:center}
.stile .n{font-size:1.8rem;font-weight:800;color:#1a7a5e}
.stile .l{font-size:.78rem;color:#6b8f7e;margin-top:.2rem}
.vtable{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden}
.vtable h3{padding:.9rem 1rem;font-size:.9rem;font-weight:700;border-bottom:1px solid #e8f0ec}
.vr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;padding:.65rem 1rem;border-bottom:1px solid #e8f0ec;font-size:.8rem;align-items:center}
.vr:last-child{border-bottom:none}
.vr.vh{font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#6b8f7e;background:#f4f7f5}
.vtg{display:inline-block;border-radius:8px;padding:.12rem .45rem;font-size:.72rem;font-weight:700}
.vtg-a{background:#d1fae5;color:#065f46}
.vtg-w{background:#fffbeb;color:#d97706}
.vtg-r{background:#fef2f2;color:#dc2626}
</style>
</head>
<body>

<div class="header">
  <h1>🧠 Psycholab Admin</h1>
  <span class="badge" id="hbadge">Connectez-vous</span>
</div>

<div id="loginArea" class="login-wrap">
  <div class="login-card">
    <h2>🔐 Accès Administrateur</h2>
    <div class="field">
      <input type="email" id="aEmail" placeholder="Email admin" value="psycholab.tn@gmail.com"/>
    </div>
    <div class="field">
      <input type="password" id="aPass" placeholder="Mot de passe"/>
      <button class="eye" type="button" id="eyeBtn">👁️</button>
    </div>
    <button class="btn-login" id="loginBtn">Se connecter</button>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<div id="mainArea" style="display:none">
  <div class="main">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('attente',this)">En attente <span class="nbadge" id="cntW">0</span></div>
      <div class="tab" onclick="switchTab('valide',this)">Validés</div>
      <div class="tab" onclick="switchTab('rejete',this)">Rejetés</div>
      <div class="tab" onclick="switchTab('all',this)">Tous</div>
      <div class="tab" onclick="switchTab('stats',this)">📊 Stats</div>
    </div>
    <div id="list"></div>
    <div id="statsArea" style="display:none"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://oybfxetivkwnynpvojki.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95YmZ4ZXRpdmt3bnlucHZvamtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM2MDI2NTgsImV4cCI6MjA1OTE3ODY1OH0.sb_publishable_3lGMf5FZavPM9aSnZEqlFA_6uzmH_CL';
const PASS = 'PsychoAdmin2024!';
let pros = [];
let curTab = 'attente';

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('aPass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  document.getElementById('eyeBtn').addEventListener('click', togglePass);
});

function togglePass() {
  const inp = document.getElementById('aPass');
  const btn = document.getElementById('eyeBtn');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
}

function doLogin() {
  const email = document.getElementById('aEmail').value.trim();
  const pass = document.getElementById('aPass').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');

  err.style.display = 'none';

  if (email !== 'psycholab.tn@gmail.com') {
    err.textContent = 'Email incorrect.';
    err.style.display = 'block';
    return;
  }
  if (pass !== PASS) {
    err.textContent = 'Mot de passe incorrect.';
    err.style.display = 'block';
    return;
  }

  btn.textContent = '⏳ Connexion...';
  btn.disabled = true;
  document.getElementById('loginArea').style.display = 'none';
  document.getElementById('mainArea').style.display = 'block';
  document.getElementById('hbadge').textContent = 'Chargement...';
  loadData();
}

async function apiCall(path) {
  const r = await fetch(SUPABASE_URL + path, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
  return r.json();
}

async function loadData() {
  try {
    const data = await apiCall('/rest/v1/pros?select=*&order=candidature_date.desc');
    pros = Array.isArray(data) ? data : [];
    const w = pros.filter(p => p.statut_candidature === 'en_attente' || (!p.statut_candidature && !p.active));
    document.getElementById('cntW').textContent = w.length;
    document.getElementById('hbadge').textContent = w.length + ' en attente';
    renderList(curTab);
  } catch(e) {
    document.getElementById('hbadge').textContent = 'Erreur chargement';
    document.getElementById('list').innerHTML = '<div class="empty">Erreur de connexion à la base de données.</div>';
  }
}

function switchTab(tab, el) {
  curTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (tab === 'stats') {
    document.getElementById('list').style.display = 'none';
    document.getElementById('statsArea').style.display = 'block';
    renderStats();
  } else {
    document.getElementById('list').style.display = 'block';
    document.getElementById('statsArea').style.display = 'none';
    renderList(tab);
  }
}

function getStatut(p) {
  return p.statut_candidature || (p.active ? 'valide' : 'en_attente');
}

function renderList(tab) {
  let list = pros;
  if (tab === 'attente') list = pros.filter(p => getStatut(p) === 'en_attente');
  else if (tab === 'valide') list = pros.filter(p => getStatut(p) === 'valide');
  else if (tab === 'rejete') list = pros.filter(p => getStatut(p) === 'rejete');

  const el = document.getElementById('list');
  if (!list.length) { el.innerHTML = '<div class="empty">📭 Aucune candidature ici.</div>'; return; }

  el.innerHTML = list.map(p => {
    const s = getStatut(p);
    const badge = s === 'en_attente' ? '<span class="bwait">⏳ Attente</span>'
      : s === 'valide' ? '<span class="bok">✅ Validé</span>'
      : '<span class="brej">❌ Rejeté</span>';
    const date = p.candidature_date
      ? new Date(p.candidature_date).toLocaleDateString('fr-FR', {day:'numeric',month:'short',year:'numeric'})
      : '—';
    const langs = [p.lang_fr&&'FR', p.lang_ar&&'AR', p.lang_en&&'EN'].filter(Boolean).join(' · ') || '—';
    const DAYS = {lundi:'Lun',mardi:'Mar',mercredi:'Mer',jeudi:'Jeu',vendredi:'Ven',samedi:'Sam',dimanche:'Dim'};
    let chips = '';
    if (p.avail && typeof p.avail === 'object') {
      Object.entries(p.avail).forEach(([d,sl]) => {
        if(sl&&sl.length) chips += `<span class="chip">${DAYS[d]||d}: ${sl[0]}</span>`;
      });
    }
    const actBtns = s === 'en_attente'
      ? `<button class="btn-v" onclick="valider('${p.id}',this)">✅ Valider</button><button class="btn-r" onclick="rejeter('${p.id}',this)">❌ Rejeter</button>`
      : s === 'valide'
      ? `<button class="btn-r" onclick="rejeter('${p.id}',this)">Désactiver</button>`
      : `<button class="btn-v" onclick="valider('${p.id}',this)">Réactiver</button>`;

    return `<div class="card">
      <div class="card-head" onclick="tog('d_${p.id}')">
        <div class="avatar">👤</div>
        <div class="cinfo">
          <div class="cname">${p.fn||''} ${p.ln||''}</div>
          <div class="cmeta">${p.spec||'—'} · ${date}</div>
        </div>
        ${badge}
      </div>
      <div class="detail" id="d_${p.id}">
        <div class="dgrid">
          <div class="di"><label>Email</label><p>${p.email||'—'}</p></div>
          <div class="di"><label>Tél</label><p>${p.tel||'—'}</p></div>
          <div class="di"><label>Tarif</label><p>${p.price||'—'} TND</p></div>
          <div class="di"><label>Langues</label><p>${langs}</p></div>
          <div class="di"><label>RPPS</label><p>${p.rpps||'—'}</p></div>
          <div class="di"><label>Fuseau</label><p>${p.tz||'—'}</p></div>
        </div>
        <div class="bio"><label>Biographie</label><p>${p.bio||'—'}</p></div>
        ${chips ? `<div class="bio"><label>Disponibilités</label><div class="chips">${chips}</div></div>` : ''}
        <div class="acts">${actBtns}</div>
        <div class="amsg" id="m_${p.id}"></div>
      </div>
    </div>`;
  }).join('');
}

function tog(id) {
  document.getElementById(id).classList.toggle('open');
}

async function valider(id, btn) {
  const msg = document.getElementById('m_'+id);
  btn.disabled = true; btn.textContent = '⏳...';
  const r = await fetch(SUPABASE_URL+'/rest/v1/pros?id=eq.'+id, {
    method:'PATCH', headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body: JSON.stringify({active:true, statut_candidature:'valide'})
  });
  msg.style.display='block';
  if (r.ok) {
    msg.className='amsg amsg-ok'; msg.textContent='✅ Profil validé et activé !';
    const i = pros.findIndex(p=>p.id===id);
    if(i>=0){pros[i].active=true;pros[i].statut_candidature='valide';}
    btn.textContent='✅ Validé';
  } else {
    msg.className='amsg amsg-err'; msg.textContent='Erreur lors de la validation.';
    btn.disabled=false; btn.textContent='✅ Valider';
  }
}

async function rejeter(id, btn) {
  if (!confirm('Confirmer le rejet ?')) return;
  const msg = document.getElementById('m_'+id);
  btn.disabled=true;
  const r = await fetch(SUPABASE_URL+'/rest/v1/pros?id=eq.'+id, {
    method:'PATCH', headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body: JSON.stringify({active:false, statut_candidature:'rejete'})
  });
  msg.style.display='block';
  if (r.ok) {
    msg.className='amsg amsg-err'; msg.textContent='❌ Candidature rejetée.';
    const i = pros.findIndex(p=>p.id===id);
    if(i>=0){pros[i].active=false;pros[i].statut_candidature='rejete';}
    btn.textContent='Rejeté';
  } else {
    msg.className='amsg amsg-err'; msg.textContent='Erreur.';
    btn.disabled=false;
  }
}

function renderStats() {
  const total = pros.length;
  const actifs = pros.filter(p=>getStatut(p)==='valide').length;
  const attente = pros.filter(p=>getStatut(p)==='en_attente').length;
  const now = new Date();
  const debut = new Date(now.getFullYear(), now.getMonth(), 1);
  const cemois = pros.filter(p=>p.candidature_date && new Date(p.candidature_date)>=debut).length;

  document.getElementById('statsArea').innerHTML = `
    <div class="sgrid">
      <div class="stile"><div class="n">${total}</div><div class="l">Total inscrits</div></div>
      <div class="stile"><div class="n">${actifs}</div><div class="l">Profils actifs</div></div>
      <div class="stile"><div class="n">${attente}</div><div class="l">En attente</div></div>
      <div class="stile"><div class="n">${cemois}</div><div class="l">Ce mois-ci</div></div>
    </div>
    <div class="vtable">
      <h3>👥 Praticiens inscrits</h3>
      <div class="vr vh"><span>Nom / Email</span><span>Date</span><span>Statut</span></div>
      ${pros.map(p => {
        const s = getStatut(p);
        const tag = s==='valide' ? '<span class="vtg vtg-a">✅ Actif</span>'
          : s==='en_attente' ? '<span class="vtg vtg-w">⏳ Attente</span>'
          : '<span class="vtg vtg-r">❌ Rejeté</span>';
        const d = p.candidature_date ? new Date(p.candidature_date).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'2-digit'}) : '—';
        return `<div class="vr"><div><strong>${p.fn||''} ${p.ln||''}</strong><br/><small style="color:#6b8f7e;word-break:break-all">${p.email||''}</small></div><div style="color:#6b8f7e">${d}</div><div>${tag}</div></div>`;
      }).join('')}
    </div>
    <div style="margin-top:.8rem;background:#fff;border-radius:12px;padding:1rem;box-shadow:0 2px 12px rgba(0,0,0,.07)">
      <p style="font-size:.85rem;margin-bottom:.6rem;color:#6b8f7e">Voir tous les comptes utilisateurs :</p>
      <a href="https://supabase.com/dashboard/project/oybfxetivkwnynpvojki/auth/users" target="_blank"
         style="display:inline-block;background:#1a7a5e;color:#fff;padding:.5rem 1rem;border-radius:8px;font-size:.85rem;font-weight:600;text-decoration:none">
        🔗 Supabase Auth →
      </a>
    </div>`;
}
</script>
</body>
</html>
